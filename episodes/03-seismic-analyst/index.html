<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지진 분석관</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script type="module" src="./src/main.ts"></script>
</head>
<body>
<div class="wrap">
  <header>
    <button class="lang-btn" id="langBtn" type="button"></button>
    <h1 data-i18n="title"></h1>
    <p data-i18n="lead"></p>
    <button class="tut-btn" id="tutOpen" data-i18n="tutOpen"></button>
  </header>

  <section class="panel resume" id="resumeBox" hidden data-i18n-aria="aResume">
    <p class="resume-q" data-i18n="resumeQ"></p>
    <div class="actions"><button class="btn-primary" id="resumeGo" type="button"></button><button class="btn-sec" id="resumeNew" type="button" data-i18n="resumeNew"></button></div>
  </section>

  <section class="panel race" id="raceBox">
    <canvas id="race" data-i18n-aria="aRace"></canvas>
    <p class="note" id="raceNote" role="status"></p>
  </section>

  <section class="panel record" id="recordBox" hidden>
    <canvas id="record" data-i18n-aria="aRecord"></canvas>
    <div class="nudges">
      <div class="nudge-row"><span class="mk bl">P</span><button class="nudge-btn" id="pMinus" type="button" data-i18n-aria="aPMinus">◀</button><span class="val" id="pV"></span><button class="nudge-btn" id="pPlus" type="button" data-i18n-aria="aPPlus">▶</button></div>
      <div class="nudge-row"><span class="mk o">S</span><button class="nudge-btn" id="sMinus" type="button" data-i18n-aria="aSMinus">◀</button><span class="val" id="sV"></span><button class="nudge-btn" id="sPlus" type="button" data-i18n-aria="aSPlus">▶</button></div>
    </div>
    <p class="note" id="recordNote" role="status"></p>
    <p class="small axis-note" data-i18n="recordAxis"></p>
  </section>

  <section class="panel map" id="mapBox" hidden>
    <canvas id="map" data-i18n-aria="aMap"></canvas>
    <p class="note" id="mapNote" role="status"></p>
  </section>

  <section class="panel est" id="estBox" hidden data-i18n-aria="aEst">
    <div class="res-head"><span id="resAt" class="small"></span><span class="res-f"><span class="small" data-i18n="resFL"></span> <b id="resF"></b> <span class="small">km²</span></span></div>
    <div id="resBars" class="res-bars"></div>
  </section>

  <section class="panel" data-i18n-aria="aPanel">
    <p class="stats" id="cond" data-i18n="cond"></p>
    <div class="ctl" id="distCtl">
      <div class="ctl-head"><label for="dist" data-i18n="distL"></label><span class="val" id="distV"></span></div>
      <div class="row"><input type="range" id="dist" min="0" max="300" step="1" value="84"></div>
    </div>
    <div class="ctl" id="rBCtl" hidden>
      <div class="ctl-head"><label for="rB" data-i18n="rBL"></label><span class="val" id="rBV"></span></div>
      <div class="row"><input type="range" id="rB" min="0" max="250" step="1" value="40"></div>
    </div>
  </section>

  <section class="panel notes" id="notes" data-i18n-aria="aNotes"></section>
</div>

<div class="tut-ctrl answer" id="tutCtrl" hidden>
  <p class="answer-title" id="answerTitle"></p>
  <div class="answer-calc" id="answerCalc" hidden></div>
  <div class="answer-fields" id="answerFields"></div>
  <div class="answer-acts"><button class="btn-primary" id="answerGo" type="button"></button></div>
</div>
</body>
</html>
